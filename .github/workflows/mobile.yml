name: Mobile — Type Check & Lint

on:
  push:
    branches: ["main"]
    paths:
      - "apps/mobile/**"
      - "package.json"
  pull_request:
    branches: ["main"]
    paths:
      - "apps/mobile/**"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Expo Doctor
        run: npx expo-doctor
