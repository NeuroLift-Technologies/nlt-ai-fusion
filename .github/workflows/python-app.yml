name: Python — Cognitive Layer

on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "tests/**"
      - "backend/**"
      - "requirements.txt"
      - "pytest.ini"
      - "apps/api/**"
  pull_request:
    branches: ["main"]
    paths:
      - "src/**"
      - "tests/**"
      - "backend/**"
      - "requirements.txt"
      - "pytest.ini"
      - "apps/api/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install cognitive layer dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pytest-cov
          pip install -r requirements.txt

      - name: Install API dependencies
        run: pip install -r apps/api/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Lint — cognitive layer
        run: |
          flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Lint — backend
        run: |
          flake8 backend/app/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 backend/app/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Lint — API
        run: |
          flake8 apps/api/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 apps/api/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Test cognitive layer
        run: |
          pytest --tb=short \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=html:htmlcov \
            --cov-report=xml \
            --cov-fail-under=40
